{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="{% block theme_color %}#03070f{% endblock %}">
    <meta name="description" content="The Academic Mirror ceremonial portrait experience">
    <link rel="manifest" href="{% url 'web-manifest' %}">
    <link rel="icon" href="{% static 'kiosk-mark.svg' %}" type="image/svg+xml">
    {% block styles %}
    <link rel="stylesheet" href="{% static 'mirror/css/app.css' %}">
    <link rel="stylesheet" href="{% static 'mirror/css/django.css' %}">
    {% endblock %}
    <title>{% block title %}The Academic Mirror{% endblock %}</title>
    {% block head %}{% endblock %}
  </head>
  <body>
    {% block body %}{% endblock %}
    <script src="{% static 'mirror/js/app.js' %}" defer></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
